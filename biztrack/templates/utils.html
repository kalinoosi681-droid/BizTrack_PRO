{% extends "layout.html" %}
{% block content %}
<h2>Utilities</h2>
<ul>
    {% for u in utilities %}
    <li>{{ u.name }}</li>
    {% endfor %}
</ul>

<h3>Run CLI Command</h3>
<form id="cli-form">
    <input type="text" name="command" id="command" placeholder="Enter command">
    <button type="submit">Run</button>
</form>
<pre id="cli-output"></pre>

<script>
document.getElementById("cli-form").addEventListener("submit", async function(e){
    e.preventDefault();
    const cmd = document.getElementById("command").value;
    const res = await fetch("{{url_for('run_command')}}""

        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({command: cmd})
    });
    const data = await res.json();
    document.getElementById("cli-output").textContent = data.output;
});
</script>
{% endblock %}
