{% extends "layout.html" %}
{% block content %}
<h2 class="mb-4">Utilities</h2>

<div class="row">
  <!-- CLI Terminal -->
  <div class="col-md-6 mb-4">
    <div class="card shadow-sm">
      <div class="card-header fw-bold">BizTrack CLI</div>
      <div class="card-body bg-dark text-light p-3 rounded" style="height:300px; overflow-y:auto; font-family:monospace;" id="cli-terminal">
        <div>> Welcome to BizTrack CLI</div>
      </div>
      <div class="card-footer">
        <form id="cli-form" class="d-flex w-100">
          <div class="position-relative w-100">
            <input type="text" id="command" class="form-control me-2" placeholder="Enter command" autocomplete="off">
            <div id="cli-suggest" class="list-group position-absolute w-100" style="z-index:1070;"></div>
          </div>
          <button class="btn btn-primary">Run</button>
        </form>
      </div>
    </div>
  </div>

  <!-- CSV Utilities -->
  <div class="col-md-6 mb-4">
    <div class="card shadow-sm">
      <div class="card-header fw-bold">CSV Import / Export</div>
      <div class="card-body">
        <a href="{{ url_for('main.export_table', table='products') }}" class="btn btn-sm btn-outline-primary mb-2">Export Products</a>
        <a href="{{ url_for('main.export_table', table='customers') }}" class="btn btn-sm btn-outline-primary mb-2">Export Customers</a>
        <form action="{{ url_for('main.import_table', table='products') }}" method="post" enctype="multipart/form-data" class="mt-2">
          <label class="form-label">Import Products CSV</label>
          <input type="file" name="file" class="form-control form-control-sm mb-2">
          <button type="submit" class="btn btn-sm btn-outline-success">Import</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <!-- Payroll Utilities -->
  <div class="col-md-6 mb-4">
    <div class="card shadow-sm">
      <div class="card-header fw-bold">Payroll Utilities</div>
      <div class="card-body">
        <p class="text-muted">Quick access to payroll records.</p>
        <a href="{{ url_for('main.payrolls') }}" class="btn btn-sm btn-outline-primary">Manage Payrolls</a>
      </div>
    </div>
  </div>

  <!-- Low Stock Alerts -->
  <div class="col-md-6 mb-4">
    <div class="card shadow-sm">
      <div class="card-header fw-bold">Low Stock Alerts</div>
      <div class="card-body">
        <p class="text-muted">View products below threshold.</p>
        <a href="{{ url_for('main.low_stock_alerts') }}" class="btn btn-sm btn-outline-danger">View Alerts</a>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const input = document.getElementById("command");
  const terminal = document.getElementById("cli-terminal");
  const history = [];
  let index = -1;

  // History navigation
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") {
      if (history.length) {
        index = Math.max(0, index - 1);
        input.value = history[index];
      }
      e.preventDefault();
    } else if (e.key === "ArrowDown") {
      if (history.length) {
        index = Math.min(history.length - 1, index + 1);
        input.value = history[index];
      }
      e.preventDefault();
    } else if (e.key === "Enter") {
      index = history.length;
    }
  });

  // Submit handler
  document.getElementById("cli-form").addEventListener("submit", async function(e) {
    e.preventDefault();
    const cmd = input.value.trim();
    if (!cmd) return;

    history.push(cmd);
    index = history.length;

    terminal.innerHTML += `<div>> ${cmd}</div>`;
    terminal.innerHTML += `<div class="text-warning">Running...</div>`;

    const res = await fetch("{{ url_for('main.run_command') }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ command: cmd })
    });
    const data = await res.json();
    terminal.innerHTML += `<div>${data.output}</div>`;
    terminal.scrollTop = terminal.scrollHeight;
    input.value = "";
  });

  // Autocomplete suggestions
  const allowed = {{ utilities|tojson }};
  const suggest = document.getElementById("cli-suggest");

  input.addEventListener("input", () => {
    const q = input.value.toLowerCase();
    suggest.innerHTML = "";
    if (!q) return;
    allowed.filter(c => c.startsWith(q)).slice(0,5).forEach(c => {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "list-group-item list-group-item-action";
      item.textContent = c;
      item.onclick = () => { input.value = c; suggest.innerHTML = ""; };
      suggest.appendChild(item);
    });
  });

  document.addEventListener("click", (e) => {
    if (!suggest.contains(e.target) && e.target !== input) suggest.innerHTML = "";
  });
})();
</script>
{% endblock %}
