{% extends "layout.html" %}
{% block content %}
<h2 class="mb-4">System Routes & CLI</h2>

<!-- Routes Reference -->
<div class="card shadow-sm border-0 animate__animated animate__fadeIn">
  <div class="card-body">
    <h5 class="card-title">Available Commands</h5>
    <ul class="list-group list-group-flush">
      {% for r in routes %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <span><i class="fas fa-terminal text-primary me-2"></i>{{ r.name }}</span>
        <small class="text-muted">{{ r.description }}</small>
      </li>
      {% endfor %}
    </ul>
  </div>
</div>

<!-- CLI Terminal -->
<h3 class="mt-4">Run CLI Command</h3>
<div id="cli-terminal" class="bg-dark text-light p-3 rounded shadow-sm animate__animated animate__fadeIn" 
     style="height:300px; overflow-y:auto; font-family:monospace;">
    <div>> Welcome to BizTrack CLI</div>
</div>

<!-- CLI Form with Autocomplete -->
<form id="cli-form" class="mt-2 d-flex w-100">
  <div class="position-relative w-100">
    <input type="text" id="command" class="form-control me-2" placeholder="Enter command" autocomplete="off">
    <div id="cli-suggest" class="list-group position-absolute w-100" style="z-index:1070;"></div>
  </div>
  <button class="btn btn-primary">Run</button>
</form>

<script>
(function() {
  const input = document.getElementById("command");
  const terminal = document.getElementById("cli-terminal");
  const history = [];
  let index = -1;

  // History navigation (↑ / ↓)
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") {
      if (history.length) {
        index = Math.max(0, index - 1);
        input.value = history[index];
      }
      e.preventDefault();
    } else if (e.key === "ArrowDown") {
      if (history.length) {
        index = Math.min(history.length - 1, index + 1);
        input.value = history[index];
      }
      e.preventDefault();
    } else if (e.key === "Enter") {
      index = history.length;
    }
  });

  // Submit handler
  document.getElementById("cli-form").addEventListener("submit", async function(e) {
    e.preventDefault();
    const cmd = input.value.trim();
    if (!cmd) return;

    history.push(cmd);
    index = history.length;

    terminal.innerHTML += `<div>> ${cmd}</div>`;
    terminal.innerHTML += `<div class="text-warning">Running...</div>`;

    const res = await fetch("{{ url_for('main.run_command') }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ command: cmd })
    });
    const data = await res.json();
    terminal.innerHTML += `<div>${data.output}</div>`;
    terminal.scrollTop = terminal.scrollHeight;
    input.value = "";
  });

  // Autocomplete suggestions
  const allowed = {{ routes|map(attribute='name')|list|tojson }};
  const suggest = document.getElementById("cli-suggest");

  input.addEventListener("input", () => {
    const q = input.value.toLowerCase();
    suggest.innerHTML = "";
    if (!q) return;
    allowed.filter(c => c.startsWith(q)).slice(0,5).forEach(c => {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "list-group-item list-group-item-action";
      item.textContent = c;
      item.onclick = () => { input.value = c; suggest.innerHTML = ""; };
      suggest.appendChild(item);
    });
  });

  document.addEventListener("click", (e) => {
    if (!suggest.contains(e.target) && e.target !== input) suggest.innerHTML = "";
  });
})();
</script>
{% endblock %}
