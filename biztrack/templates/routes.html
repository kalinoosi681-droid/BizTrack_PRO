<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BizTrack PRO - Routes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Minimal override for table/CLI area */
        .cli-container {
            background-color: #1e1e2f;
            color: #cfd8dc;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            margin-top: 1rem;
        }
        .cli-input {
            width: 100%;
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #2a2a3a;
            color: #cfd8dc;
        }
        .cli-output {
            margin-top: 1rem;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .dark-mode-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<button class="dark-mode-toggle" onclick="toggleDarkMode()">🌙</button>
<main>
    <h1>Routes / CLI</h1>
    <p>Enter a command below and press Enter:</p>

    <div class="cli-container">
        <input type="text" id="cliCommand" class="cli-input" placeholder="Type command (e.g., show routes, help)">
        <div id="cliOutput" class="cli-output"></div>
    </div>

    <script>
        const cliInput = document.getElementById('cliCommand');
        const cliOutput = document.getElementById('cliOutput');

        cliInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const cmd = cliInput.value.trim();
                if (!cmd) return;

                // Basic CLI emulation
                let response = '';
                switch(cmd.toLowerCase()) {
                    case 'help':
                        response = 'Available commands:\n - help\n - show routes\n - clear';
                        break;
                    case 'show routes':
                        response = 'Dashboard | Products | Customers | Invoices | Top Sellers | Utilities';
                        break;
                    case 'clear':
                        cliOutput.innerHTML = '';
                        cliInput.value = '';
                        return;
                    default:
                        response = `Unknown command: ${cmd}`;
                }

                cliOutput.innerHTML += `> ${cmd}\n${response}\n`;
                cliOutput.scrollTop = cliOutput.scrollHeight;
                cliInput.value = '';
            }
        });

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            if(document.body.classList.contains('dark-mode')) {
                document.body.style.backgroundColor = '#121212';
                document.body.style.color = '#cfd8dc';
            } else {
                document.body.style.backgroundColor = '#fff';
                document.body.style.color = '#111';
            }
        }
    </script>
</main>
</body>
</html>
