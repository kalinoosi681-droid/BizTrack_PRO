{% extends "base.html" %}
{% block title %}System Test{% endblock %}
{% block content %}
<h1>BizTrack PRO - System Test</h1>

<div class="card mb-3">
    <div class="card-header">1. Chart.js Test</div>
    <div class="card-body">
        <canvas id="testChart" height="100"></canvas>
        <script>
            if (typeof Chart !== 'undefined') {
                document.write('<p class="text-success">✅ Chart.js is loaded!</p>');
                const ctx = document.getElementById('testChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Mon', 'Tue', 'Wed'],
                        datasets: [{
                            label: 'Test Data',
                            data: [10, 20, 15],
                            backgroundColor: 'rgba(13, 110, 253, 0.5)'
                        }]
                    }
                });
            } else {
                document.write('<p class="text-danger">❌ Chart.js NOT loaded!</p>');
            }
        </script>
    </div>
</div>

<div class="card mb-3">
    <div class="card-header">2. API Test</div>
    <div class="card-body">
        <button class="btn btn-primary" onclick="testAPI()">Test Realtime API</button>
        <pre id="apiResult" class="mt-3"></pre>
        <script>
            async function testAPI() {
                const result = document.getElementById('apiResult');
                result.textContent = 'Loading...';
                try {
                    const response = await fetch('/api/dashboard/realtime');
                    const data = await response.json();
                    result.textContent = JSON.stringify(data, null, 2);
                    result.className = 'mt-3 alert alert-success';
                } catch (error) {
                    result.textContent = 'ERROR: ' + error.message;
                    result.className = 'mt-3 alert alert-danger';
                }
            }
        </script>
    </div>
</div>

<div class="card mb-3">
    <div class="card-header">3. AI Chat Test</div>
    <div class="card-body">
        <button class="btn btn-primary" onclick="testAI()">Test AI API</button>
        <pre id="aiResult" class="mt-3"></pre>
        <script>
            async function testAI() {
                const result = document.getElementById('aiResult');
                result.textContent = 'Loading...';
                try {
                    const csrf = document.querySelector('input[name="csrf_token"]').value;
                    const response = await fetch('/api/ai/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrf
                        },
                        body: JSON.stringify({ query: 'Hello' })
                    });
                    const data = await response.json();
                    result.textContent = JSON.stringify(data, null, 2);
                    result.className = 'mt-3 alert alert-success';
                } catch (error) {
                    result.textContent = 'ERROR: ' + error.message;
                    result.className = 'mt-3 alert alert-danger';
                }
            }
        </script>
    </div>
</div>
{% endblock %}
