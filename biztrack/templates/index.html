{% extends "layout.html" %}
{% block content %}
<h1>Dashboard</h1>
<div class="cards">
    <div class="card">Products: {{ products|length }}</div>
    <div class="card">Invoices: {{ invoices|length }}</div>
</div>

<style>
.cards { display:flex; gap:20px; flex-wrap:wrap; margin-top:20px; }
.card { flex:1; min-width:150px; background:#1f1f1f; padding:20px; border-radius:8px; text-align:center; }
.card:hover { background:#333; }
</style>
{% endblock %}
