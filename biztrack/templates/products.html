{% extends "layout.html" %}
{% block content %}
<h2>Products</h2>
<table class="styled-table">
    <thead>
        <tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th></tr>
    </thead>
    <tbody>
        {% for product in products %}
        <tr>
            <td>{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>{{ product.price }}</td>
            <td>{{ product.stock }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<style>
.styled-table { width:100%; border-collapse:collapse; margin-top:20px; }
.styled-table th, .styled-table td { padding:12px 15px; border-bottom:1px solid #333; text-align:left; }
.styled-table th { background:#1f1f1f; }
.styled-table tr:hover { background:#2c2c2c; }
</style>
{% endblock %}
