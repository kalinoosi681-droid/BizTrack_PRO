{% extends "layout.html" %}
{% block content %}
<div class="login-container">
    <h2>Login to BizTrack PRO</h2>
    <form method="POST" action="{{ url_for('auth.login') }}">
        {{ csrf_token() }}
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

</div>

<style>
.login-container { max-width: 400px; margin:50px auto; padding:30px; background:#1f1f1f; border-radius:10px; box-shadow:0 0 15px rgba(0,0,0,0.5); text-align:center; }
.login-container input { width:100%; padding:10px; margin:10px 0; border:none; border-radius:5px; }
.login-container button { padding:10px 20px; border:none; border-radius:5px; background:#00bcd4; color:white; cursor:pointer; font-weight:bold; }
.login-container button:hover { background:#0097a7; }
</style>
{% endblock %}
