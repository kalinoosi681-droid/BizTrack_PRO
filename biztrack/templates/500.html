{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="container text-center py-5">

        <div class="col-md-8">
            <h1 class="display-1 fw-bold">500</h1>

            <a href="{{ url_for('main.index') }}" class="btn btn-primary"><i class="fas fa-home me-2"></i>Go to Homepage</a>
        </div>
    </div>
</div>
{% endblock %}
