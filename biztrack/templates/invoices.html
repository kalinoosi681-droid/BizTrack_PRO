{% extends "layout.html" %}
{% block content %}
<h2>Invoices</h2>
<table class="styled-table">
    <thead>
        <tr><th>ID</th><th>Customer</th><th>Total</th><th>Date</th></tr>
    </thead>
    <tbody>
        {% for invoice in invoices %}
        <tr>
            <td>{{ invoice.id }}</td>
            <td>{{ invoice.customer_name }}</td>
            <td>{{ invoice.total }}</td>
            <td>{{ invoice.date }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
