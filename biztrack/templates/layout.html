<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BizTrack PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        nav { display:flex; gap: 15px; padding: 10px; background: #1f1f1f; }
        nav a { color: #e0e0e0; text-decoration: none; font-weight: bold; }
        nav a:hover { color: #00bcd4; }
        .flashes { list-style: none; padding:0; margin:10px 0; }
        .flashes li { padding:8px 12px; margin-bottom:4px; border-radius:4px; }
        .success { background-color:#4caf50; color:white; }
        .error { background-color:#f44336; color:white; }
        .container { padding:20px; max-width:1200px; margin:auto; }
        .darkmode { background-color:#121212; color:#e0e0e0; }
        .lightmode { background-color:#f5f5f5; color:#212121; }
        .toggle-switch { cursor:pointer; margin-left:auto; padding:0 10px; }
    </style>
    <button id="theme-toggle">Toggle Dark/Light</button>
    <script>
        const themeBtn = document.getElementById("theme-toggle");
        const darkMode = localStorage.getItem("darkMode") === "true";
        document.body.classList.toggle("dark", darkMode);

        themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        localStorage.setItem("darkMode", document.body.classList.contains("dark"));
   });
    </script>
    <style>
        body.dark { background:#121212; color:#eee; }
        body.dark table { color:#eee; }
        button { cursor:pointer; }
    </style>
</head>
<body>
<nav>
    <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
    <a href="{{ url_for('main.products') }}">Products</a>
    <a href="{{ url_for('main.customers') }}">Customers</a>
    <a href="{{ url_for('main.invoices') }}">Invoices</a>
    <a href="{{ url_for('main.top_sellers') }}">Top Sellers</a>
    <a href="{{ url_for('main.utils') }}">Utilities</a>
    <a href="{{ url_for('auth.logout') }}">Logout</a>
    <span class="toggle-switch" onclick="toggleDarkMode()">🌓</span>
</nav>

<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul class="flashes">
            {% for category, msg in messages %}
                <li class="{{ category }}">{{ msg }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

<script>
    // Dark / Light mode toggle
    function toggleDarkMode() {
        const body = document.body;
        const mode = body.classList.contains('darkmode') ? 'lightmode' : 'darkmode';
        body.className = mode;
        localStorage.setItem('mode', mode);
    }
    window.onload = () => {
        const savedMode = localStorage.getItem('mode') || 'darkmode';
        document.body.className = savedMode;
    }
</script>
</body>
</html>
