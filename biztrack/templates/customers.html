{% extends "layout.html" %}
{% block content %}
<h2>Customers</h2>
<table class="styled-table">
    <thead>
        <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th></tr>
    </thead>
    <tbody>
        {% for customer in customers %}
        <tr>
            <td>{{ customer.id }}</td>
            <td>{{ customer.name }}</td>
            <td>{{ customer.email }}</td>
            <td>{{ customer.phone }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
