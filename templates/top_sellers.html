{% extends "layout.html" %}
{% block content %}
<h2>Top Sellers</h2>

<table>
    <tr><th>Product</th><th>Quantity Sold</th></tr>
    {% for name, sold_qty in top_sellers %}
    <tr>
        <td>{{ name }}</td>
        <td>{{ sold_qty }}</td>
    </tr>
    {% endfor %}
</table>

<canvas id="chartTopSellers" width="400" height="200"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const ctx = document.getElementById('chartTopSellers').getContext('2d');
const labels = [
    {% for name, _ in top_sellers %}
        "{{ name }}",
    {% endfor %}
];
const data = [
    {% for _, sold_qty in top_sellers %}
        {{ sold_qty }},
    {% endfor %}
];
const chart = new Chart(ctx, {
    type: 'bar',
    data: {
        labels: labels,
        datasets: [{
            label: 'Units Sold',
            data: data,
            backgroundColor: 'rgba(54, 162, 235, 0.6)',
            borderColor: 'rgba(54, 162, 235, 1)',
            borderWidth: 1
        }]
    },
    options: { scales: { y: { beginAtZero: true } } }
});
</script>
{% endblock %}
