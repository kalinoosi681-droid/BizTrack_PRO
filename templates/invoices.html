{% extends "layout.html" %}
{% block content %}
<h2>Create Invoice</h2>

<form method="post">
    Customer:
    <select name="customer_id" required>
        {% for c in customers %}
        <option value="{{ c[0] }}">{{ c[1] }}</option>
        {% endfor %}
    </select>
    <h3>Items</h3>
    <div id="items-container">
        <div class="item-row">
            Product:
            <select name="product_id">
                {% for p in products %}
                <option value="{{ p[0] }}" data-price="{{ p[2] }}">{{ p[1] }} (${{ p[2] }})</option>
                {% endfor %}
            </select>
            Qty: <input type="number" name="qty" value="1" min="1">
            Price: <input type="number" step="0.01" name="price" value="0.00">
        </div>
    </div>
    <button type="button" onclick="addItem()">+ Add Item</button>
    <button type="submit">Create Invoice</button>
</form>

<h3>Recent Invoices</h3>
<table>
    <tr><th>Invoice #</th><th>Customer</th><th>Total</th><th>Date</th></tr>
    {% for inv in invoices %}
    <tr>
        <td>{{ inv[0] }}</td>
        <td>{{ inv[1] }}</td>
        <td>${{ inv[2] }}</td>
        <td>{{ inv[3] }}</td>
    </tr>
    {% endfor %}
</table>

<script>
function addItem() {
    const container = document.getElementById("items-container");
    const newRow = container.children[0].cloneNode(true);
    container.appendChild(newRow);
}
</script>
{% endblock %}
