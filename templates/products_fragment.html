<div id="addProductForm" style="display:none" class="card">
  <h4>Add / Edit Product</h4>
  <form id="pform" onsubmit="return saveProduct(event)">
    <input name="id" type="hidden" />
    <label>Name</label><br/><input name="name" required /><br/>
    <label>Category</label><br/><input name="category" /><br/>
    <label>Qty</label><br/><input name="qty" type="number" min="0" value="0" /><br/>
    <label>Price</label><br/><input name="price" type="number" step="0.01" min="0" value="0.00" /><br/><br/>
    <button class="btn-primary">Save</button> <button type="button" onclick="hideAdd()">Cancel</button>
  </form>
</div>

<script>
function showAddProduct(){
  const f = document.getElementById('addProductForm');
  f.style.display = 'block';
  const form = document.getElementById('pform');
  form.id.value = '';
  form.name.value = '';
  form.category.value = '';
  form.qty.value = 0;
  form.price.value = '0.00';
}
function hideAdd(){ document.getElementById('addProductForm').style.display='none'; }

async function saveProduct(e){
  e.preventDefault();
  const f = document.getElementById('pform');
  const id = f.id.value;
  const payload = { name: f.name.value, category: f.category.value, qty: Number(f.qty.value||0), price: Number(f.price.value||0) };
  try{
    let res;
    if(id){
      res = await fetchWithCSRF(`/api/product/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
    } else {
      res = await fetchWithCSRF('/api/product', { method: 'POST', body: JSON.stringify(payload) });
    }
    if(res.ok){ showToast('Product saved', 'success'); setTimeout(()=>location.reload(), 600); }
    else { const j = await res.json().catch(()=>({})); showToast(j.error||'Save failed','error'); }
  }catch(err){ showToast('Save failed','error'); }
  return false;
}

async function editProduct(id){
  try{
    const r = await fetch(`/api/product/${id}`);
    if(!r.ok) { showToast('Failed to load product','error'); return; }
    const j = await r.json();
    showAddProduct();
    const f = document.getElementById('pform');
    f.id.value = j.id; f.name.value = j.name; f.category.value = j.category||''; f.qty.value = j.qty||0; f.price.value = j.price||0.0;
  }catch(e){ showToast('Failed to load product','error'); }
}

async function deleteProduct(id){
  if(!confirm('Delete product?')) return;
  const r = await fetchWithCSRF(`/api/product/${id}`, { method: 'DELETE' });
  if(r.ok){ showToast('Product deleted','success'); setTimeout(()=>location.reload(),400); }
  else showToast('Delete failed','error');
}
</script>
