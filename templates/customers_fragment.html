<div id="addCustForm" style="display:none" class="card">
  <h4>Add / Edit Customer</h4>
  <form id="cform" onsubmit="return saveCust(event)">
    <input name="id" type="hidden" />
    <label>Name</label><br/><input name="name" required /><br/>
    <label>Phone</label><br/><input name="phone" /><br/>
    <label>Email</label><br/><input name="email" type="email" /><br/><br/>
    <button class="btn-primary">Save</button> <button type="button" onclick="hideCust()">Cancel</button>
  </form>
</div>

<script>
function showAddCust(){ const f=document.getElementById('addCustForm'); f.style.display='block'; const c=document.getElementById('cform'); c.id.value=''; c.name.value=''; c.phone.value=''; c.email.value=''; }
function hideCust(){ document.getElementById('addCustForm').style.display='none'; }

async function saveCust(e){
  e.preventDefault();
  const f = document.getElementById('cform');
  const id = f.id.value;
  const payload = { name: f.name.value, phone: f.phone.value, email: f.email.value };
  try{
    let res;
    if(id){ res = await fetchWithCSRF(`/api/customer/${id}`, { method: 'PUT', body: JSON.stringify(payload) }); }
    else { res = await fetchWithCSRF('/api/customer', { method: 'POST', body: JSON.stringify(payload) }); }
    if(res.ok){ showToast('Customer saved','success'); setTimeout(()=>location.reload(),600); }
    else { const j = await res.json().catch(()=>({})); showToast(j.error||'Save failed','error'); }
  }catch(e){ showToast('Save failed','error'); }
  return false;
}

async function editCust(id){
  try{
    const r = await fetch(`/api/customer/${id}`);
    if(!r.ok){ showToast('Failed to load customer','error'); return; }
    const j = await r.json();
    showAddCust();
    const f = document.getElementById('cform'); f.id.value = j.id; f.name.value = j.name; f.phone.value = j.phone||''; f.email.value = j.email||'';
  }catch(e){ showToast('Failed to load customer','error'); }
}

async function deleteCust(id){ if(!confirm('Delete customer?')) return; const r = await fetchWithCSRF(`/api/customer/${id}`, { method: 'DELETE' }); if(r.ok){ showToast('Customer deleted','success'); setTimeout(()=>location.reload(),400); } else showToast('Delete failed','error'); }
</script>
