name: BizTrack CI/CD

on:
  push:
    branches: [ main, develop, 'fix/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.9', '3.10', '3.11' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-core.txt', '**/requirements-ai.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install core dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-core.txt

    - name: Install test dependencies
      run: |
        pip install pytest pytest-cov flake8

    - name: Lint with flake8
      run: |
        # Stop on syntax errors or undefined names
        flake8 biztrack --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 biztrack --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run in-process smoke tests
      run: |
        python tools/smoke_test_client.py

    - name: Run pytest tests
      run: |
        pytest tests/ -v --cov=biztrack --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Run security checks with Bandit
      run: |
        bandit -r biztrack -f json -o bandit-report.json || true